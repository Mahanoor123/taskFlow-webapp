<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Task Form</title>
</head>

<body>

    <div class="form-container">
        <form class="task-form">
            <h4 class="form-head"><i class="fas fa-info-circle"></i>Create task</h4>
            <div class="task_title">
                <input type="text" class="task-title" placeholder="Task Title">
            </div>
            <div class="taskDesc">
                <input type="text" class="task-desc" placeholder="Short description..">
            </div>
            <button class="primary_btn btn" type="submit">Create</button>
        </form> 
    </div>

    <script type="module" src="../js/task.js"></script>
</body>

</html>
