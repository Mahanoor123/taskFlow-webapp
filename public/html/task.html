<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Task Form</title>
</head>

<body>

    <div class="form-container">
        <form class="task-form">
            <h4><i class="fas fa-info-circle"></i> Create Task</h4>
            <div class="task_title">
                <input type="text" class="task-title" placeholder="Blog Title">
            </div>
            <div class="taskDesc">
                <input type="text" class="task-desc" placeholder="Short description..">
            </div>
            <div class="task_assigned">
                <select id="assigned" name="assigned">
                    <option value="" disabled selected>Assigned to</option>
                </select>
            </div>
            <button class="primary_btn btn" type="submit">Add task</button>
        </form> 
    </div>

    <script type="module" src="../js/task.js"></script>
</body>

</html>
